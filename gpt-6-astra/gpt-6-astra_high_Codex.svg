  <title id="title">The Dark Side of the Moon — 棱镜与光谱</title>
  <desc id="desc">根据本地视频绘制的十五秒循环矢量动画：黑色背景中，青白色玻璃棱镜旋转，白色光束从左侧射入，右侧展开六色光谱。</desc>
