<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowSoft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="blurBeam" x="-30%" y="-500%" width="160%" height="1100%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <linearGradient id="prismFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d2228" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#03080a" stop-opacity="0.98"/>
    </linearGradient>
    <radialGradient id="apexFlare" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e8ffff" stop-opacity="0.9"/>
      <stop offset="0.4" stop-color="#9ef4ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#9ef4ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="baseGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7ad8e8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7ad8e8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1080" height="1080" fill="#000000"/>

  <g id="flatState">
    <g id="lightPath" opacity="1">
      <animate attributeName="opacity" dur="15s" repeatCount="indefinite"
        keyTimes="0;0.26;0.34;0.46;0.54;0.62;0.70;0.78;0.92;1"
        values="1;1;0;0;0;1;1;0;0;1"/>
      <path d="M 0 518 L 455 417" stroke="#ffffff" stroke-width="12" opacity="0.3" filter="url(#blurBeam)" fill="none" stroke-linecap="round"/>
      <path d="M 0 518 L 455 417" stroke="#ffffff" stroke-width="3.5" fill="none"/>
      <path d="M 455 417 L 611 390" stroke="#ffffff" stroke-width="3" opacity="0.9" fill="none"/>
      <g filter="url(#glowSoft)">
        <polygon points="611,384 1095,338 1095,365 611,385.5" fill="#ff2222"/>
        <polygon points="611,385.5 1095,365 1095,392 611,387" fill="#ff8800"/>
        <polygon points="611,387 1095,392 1095,419 611,388.5" fill="#ffe11a"/>
        <polygon points="611,388.5 1095,419 1095,446 611,390" fill="#2ee62e"/>
        <polygon points="611,390 1095,446 1095,473 611,391.5" fill="#1fc8e0"/>
        <polygon points="611,391.5 1095,473 1095,500 611,393" fill="#2a5cff"/>
        <polygon points="611,393 1095,500 1095,528 611,394.5" fill="#9b3dff"/>
      </g>
      <polygon points="611,384 1095,338 1095,528 611,394.5" fill="#ffffff" opacity="0.06"/>
    </g>

    <g id="prismFlat">
      <polygon points="540,258 708,572 372,572" fill="url(#prismFill)"/>
      <ellipse cx="540" cy="270" rx="120" ry="90" fill="url(#apexFlare)" opacity="0.8"/>
      <ellipse cx="540" cy="575" rx="200" ry="40" fill="url(#baseGlow)" opacity="0.6"/>
      <polygon points="540,258 708,572 372,572" fill="none" stroke="#d8feff" stroke-width="5"
        stroke-linejoin="round" filter="url(#glow)"/>
      <polygon points="540,258 708,572 372,572" fill="none" stroke="#ffffff" stroke-width="1.6"
        stroke-linejoin="round" opacity="0.9"/>
      <path d="M 540 258 L 372 572" stroke="#ffffff" stroke-width="2.5" opacity="0.5" fill="none"/>
      <path d="M 455 417 L 611 390" stroke="#ffffff" stroke-width="6" opacity="0.18" filter="url(#blurBeam)" fill="none"/>
    </g>
  </g>

  <g id="prism3D" opacity="0">
    <animate attributeName="opacity" dur="15s" repeatCount="indefinite"
      keyTimes="0;0.26;0.34;0.46;0.54;0.62;0.70;0.78;0.92;1"
      values="0;0;1;1;1;0;0;1;1;0"/>
    <ellipse cx="540" cy="270" rx="130" ry="100" fill="url(#apexFlare)" opacity="0.9"/>
    <ellipse cx="540" cy="575" rx="210" ry="45" fill="url(#baseGlow)" opacity="0.7"/>
    <g fill="none" stroke="#baf8ff" stroke-width="4" stroke-linejoin="round" filter="url(#glow)">
      <path d="M 540 258 L 708 572 L 372 572 Z"/>
      <path d="M 540 258 L 568 276 L 730 578 L 708 572"/>
      <path d="M 372 572 L 396 588 L 730 578"/>
      <path d="M 568 276 L 396 588" opacity="0.7"/>
      <path d="M 540 258 L 568 276" opacity="0.9"/>
      <path d="M 372 572 L 568 276" opacity="0.45"/>
      <path d="M 708 572 L 396 588" opacity="0.35"/>
    </g>
    <g fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round" opacity="0.85">
      <path d="M 540 258 L 708 572 L 372 572 Z"/>
      <path d="M 540 258 L 568 276 L 730 578 L 708 572"/>
      <path d="M 372 572 L 396 588 L 730 578"/>
    </g>
    <animateTransform attributeName="transform" type="rotate"
      values="-2 540 420; 2 540 420; -2 540 420" dur="6s"
      repeatCount="indefinite" additive="sum"/>
  </g>
</svg>
